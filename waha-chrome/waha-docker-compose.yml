# WAHA (WhatsApp HTTP API) - template Dokploy
# Mesmos campos e volume do template do Easypanel.
# Regras: sem container_name, sem ports (usar expose), sem networks.

services:
  waha:
    image: devlikeapro/waha:${WAHA_VERSION}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
    volumes:
      - waha_sessions:/app/.sessions
    expose:
      - 3000

volumes:
  waha_sessions:
